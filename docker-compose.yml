version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MYSQL_DATABASE: agendeme_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: gabriel
      MYSQL_PASSWORD: user_password
      JWT_SECRET_KEY: 1eff814cebd5474d4e39e958e2fb58167203112106c3ce1a760d1e2b9233149f
      JWT_ISS: agendeme
    container_name: agendeme-php
    volumes:
      - ./src:/var/www 
    networks:
      - agendeme-network

  # Serviço do Banco de Dados
  db:
    image: mysql:8.0
    container_name: agendeme-db
    restart: always
    environment:
      MYSQL_DATABASE: agendeme_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: gabriel
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - agendeme-network

  # Servidor Web (Nginx) para expor o projeto no navegador
  nginx:
    image: nginx:alpine
    container_name: agendeme-nginx
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # Você precisará de um arquivo de config simples aqui
    depends_on:
      - app
    networks:
      - agendeme-network

networks:
  agendeme-network:
    driver: bridge

volumes:
  db_data: